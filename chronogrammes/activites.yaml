# =============================================================================
# PRS 2.0 — Modèle de données du chronogramme
# =============================================================================
# Source unique du générateur `generer_chronogramme.mjs`. Aucune donnée de
# planning ne doit être codée en dur ailleurs.
#
# CONVENTIONS — lire avant toute correction
#
# 1. `preuve` est obligatoire pour tout élément `termine` ou `en_cours`. Elle
#    cite un commit (hash court), un fichier du dépôt, ou une exécution de test.
#    Un élément `a_venir` porte `preuve: null` ; s'il est daté, la date est une
#    PROPOSITION à valider — elle est signalée comme telle dans `note`.
#
# 2. `avancement` n'est JAMAIS estimé au jugé. Règle :
#       termine  -> 100
#       a_venir  -> 0
#       en_cours -> ratio d'éléments dénombrables clos / total dénombré,
#                   la formule étant écrite dans le champ `preuve`.
#
# 3. Bornage des activités passées : `debut` = date du premier commit du thème,
#    `duree_jours` = nombre de jours OUVRÉS jusqu'au dernier commit du thème.
#
# 4. ⚠️ TENSION CONNUE — jours ouvrés vs activité réelle. Le dépôt montre du
#    travail massif hors jours ouvrés : 50 commits le ven. 26/06 (férié),
#    29 le dim. 05/07, 20 le dim. 26/07, 25 le sam. 15/08 (férié), 9 le
#    dim. 16/08. Avec `jours_ouvres: true` + les deux fériés retenus, trois
#    activités (A06, A14, A16) démarrent ou culminent sur un jour non ouvré.
#    Le générateur décale alors le début au premier jour ouvré suivant et le
#    signale. Pour coller à l'activité réelle, passer `jours_feries: []`.
#
# 5. `module_planification` porte `duree_jours` (jours ouvrés) ;
#    `global_prs2` porte `fin` (bornes mensuelles exactes) et le générateur en
#    déduit `duree_jours`. Les deux formes sont acceptées partout.
#
# 6. ⚠️ RÉPARTITION DES RESPONSABLES — PROPOSÉE, NON DÉDUITE DU DÉPÔT.
#    Le dépôt ne porte qu'un seul auteur git (503 commits, une seule adresse) :
#    aucun rapprochement n'est possible entre les commits et les trois noms.
#    Le découpage ci-dessous est une proposition par domaine, validée sur le
#    principe le 26/08 — à corriger ligne à ligne si l'affectation réelle diffère.
#
# 7. ÉCRITURE DES `libelle` ET DES `livrable` — un chronogramme se lit en comité
#    de pilotage, pas dans un éditeur de code.
#    · `libelle` : groupe nominal en langage métier, nommant ce que l'activité
#      PRODUIT (jamais ce qui manque). Ni chemin de fichier, ni nom de table, ni
#      constante d'énumération, ni sigle non explicité.
#      → « Délais réglementaires d'instruction », pas « Gestion des délais légaux
#        (ALERTE_DELAI) » ; « Indicateurs de performance… », pas « écrans manquants ».
#    · `livrable` : ce que l'on peut MONTRER et constater à la fin — un écran, un
#      document, une capacité — décrit du point de vue de celui qui s'en sert.
#      → « Décompte du délai légal sur chaque dossier, alerte à l'approche de
#        l'échéance », pas « calcul + alerte + indicateur ».
#    · Le détail technique (chemins, commits, noms de tables, statuts serveur)
#      appartient à `preuve` et à `constat_initial`, qui existent pour ça.
# =============================================================================

parametres:
  projet: "PRS 2.0 — Contrôle de la passation des marchés publics"
  perimetre_depot: "frontend Angular `frontendprs2` (le backend PRS20 est un dépôt distinct)"

  # Réponses du pilote, 2026-08-26.
  date_demarrage: 2026-06-17          # 1er commit `62f5f9a` « Initial commit - frontend CNM »
  date_arrete: 2026-08-26             # date d'observation ; dernier commit du dépôt : 2026-08-20
  # Échéance décalée de deux jours ouvrés le 26/08 : le polissage du module de
  # planification (A26, 24 → 28/08) repousse la reprise du développement au 31/08,
  # ce qui aurait comprimé la recette de 5 à 3 jours. Arbitrage du pilote : garder
  # 5 jours de recette et déplacer l'échéance, plutôt que raboter la recette.
  date_fin_contractuelle: 2026-09-18  # ex-16/09

  # ⚠️ 2026-06-17 → 2026-09-18 = 93 jours calendaires, soit 13 semaines + 2 jours
  # (et non 12 semaines). `semaines_gantt` est un PLANCHER : le générateur étend
  # la grille autant qu'il faut, ici à 14 colonnes.
  semaines_gantt: 13

  jours_ouvres: true

  # Calendrier Madagascar, période du module 1 uniquement.
  # 26/06/2026 = vendredi (Fête de l'Indépendance) — jour effectivement travaillé (50 commits).
  # 15/08/2026 = samedi (Assomption) — sans effet sur les jours ouvrés.
  # ⚠️ À COMPLÉTER pour la fenêtre 09/2026 → 06/2027 avant de se fier au calcul
  #    en jours ouvrés du Gantt global (01/11, 25/12, 01/01, 29/03, 01/05, …).
  jours_feries:
    - 2026-06-26
    - 2026-08-15

  # Bornes mensuelles du Gantt global : mois glissants ancrés sur le démarrage.
  # M1 = 17/06 → 16/07 … M3 = 17/08 → 16/09 … M10 = 17/03 → 16/04/2027.
  # (L'échéance du module 1, 18/09, déborde de deux jours ouvrés sur M4 — c'est voulu.)
  #
  # Ramené de 12 à 10 mois le 26/08 : durées des modules 2 et 3 fixées à 2 mois
  # chacun (au lieu de 3) et du module 4 à 1,5 mois (au lieu de 2) — arbitrage du
  # pilote. Le projet se termine le 16/04/2027 au lieu du 16/06/2027.
  mois_gantt: 10

  equipe:
    - "Mr Lanto"       # socle, sécurité, qualité
    - "Mr Mathieu"     # circuit d'instruction
    - "Mr Christian"   # planification et référentiels

