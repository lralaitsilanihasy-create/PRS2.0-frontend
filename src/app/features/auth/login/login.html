<!-- Page de connexion — design institutionnel (31/10/2026) : bandeau tricolore, en-tête au logo du Ministère, carte à deux
     volets (présentation sur la bande sombre du menu, formulaire sur fond blanc), pied de page commun. Le formulaire est
     inchangé (mêmes champs, mêmes liaisons, mêmes messages). -->
<div class="bandeau-tricolore" aria-hidden="true"><span></span><span></span><span></span></div>
<header class="lg-entete">
  <img class="lg-entete__logo" src="mef-logo.png" alt="" width="42" height="42" decoding="async" />
  <div class="lg-entete__textes">
    <span class="lg-entete__institution">Commission nationale des marchés</span>
    <span class="lg-entete__appli">PRS 2.0</span>
  </div>
</header>

<main class="login-page">
  <div class="login-card">
    <aside class="login-card__intro">
      <h1 class="login-card__title">Procurement Review System</h1>
      <p class="login-card__subtitle">Anytime, Anywhere, Anydevice</p>
    </aside>

    <section class="login-card__form">
      <!-- ⚠️ 01/11 — le formulaire est partagé avec le portail public (FormulaireConnexion) ; les liens du bas restent ceux de cet écran. -->
      <app-formulaire-connexion class="login-card__formulaire">
        <p class="login-form__signup">Nouveau&nbsp;? <a routerLink="/inscription">Créer un compte PRMP</a> · <a routerLink="/candidat/inscription">Créer un compte candidat</a> · <a routerLink="/accueil/prmp">Découvrir PRS 2.0</a></p>
      </app-formulaire-connexion>
    </section>
  </div>
</main>

<footer class="lg-pied">Commission nationale des marchés · Ministère de l'Économie et des Finances · PRS 2.0</footer>
